services:
  - type: web
    name: racing-ai-platform-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_MODE
        value: cloud
      - key: DOCS_ENABLED
        value: "false"
      - key: DATABASE_URL
        value: sqlite:////app/storage/sessions.sqlite3
      - key: STORAGE_BACKEND
        value: local
      - key: TASK_QUEUE_BACKEND
        value: inline
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
